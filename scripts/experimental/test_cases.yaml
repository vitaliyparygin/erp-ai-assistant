tests:

  - question: "Хто платник газового рахунку?"
    expected:
      - "Ivan Petrenko"

  - question: "Яка сума газового рахунку?"
    expected:
      - "147"

  - question: "Який EIC код?"
    expected:
      - "62Z1234567890123"

  - question: "Який тариф інтернету?"
    expected:
      - "100 Mbps"

  - question: "Хто виконавець договору?"
    "expected_any": [
        "ERP Solutions",
        "ERP Solutions LLC"
    ]
  - question: "Який номер сервісного договору?"
    expected:
      - SC-2024-001

  - question: "Хто замовник договору?"
    expected:
      - "Alpha LLC"

  - question: "Хто працівник у наказі?"
    expected:
      - "John Smith"

  - question: "Який contractor?"
    expected:
      - "ERP Solutions"

  - question: "Який customer у договорі?"
    expected:
      - "Alpha LLC"

  - question: "Який номер договору?"
    expected:
      - "SC-2024-001"

  - question: "Коли підписано договір?"
    expected:
      - "2024-01-15"

  - question: "До якого числа діє договір?"
    expected:
      - "2025-01-15"

  - question: "Яка сума рахунку за газ?"
    expected:
      - "147.00 UAH"

  - question: "Хто постачальник газу?"
    expected:
      - "Dnipro Gas Distribution LLC"

  - question: "Яка посада працівника?"
    expected:
      - "Backend Developer"

  - question: "Who is contractor?"
    expected:
      - "ERP Solutions LLC"

  - question: "Who is executor?"
    expected:
      - "ERP Solutions LLC"

  - question: "Хто виконавець?"
    expected:
      - "ERP Solutions LLC"

  - question: "Який телефон замовника?"
    expected:
      - "NOT_FOUND"

  - question: "Яка адреса виконавця?"
    expected:
      - "NOT_FOUND"