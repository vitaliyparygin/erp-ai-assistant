[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-benchmark"
version = "0.1.0"
description = "Framework-agnostic benchmark dataset and evaluation asset generator for RAG systems."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "vitaliy.parygin" }, { email = "vitalit.parygin@gmail.com"}]
keywords = ["rag", "benchmark", "evaluation", "llm", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
Repository = "https://github.com/vitaliyparygin/rag-benchmark"
Issues = "https://github.com/vitaliyparygin/rag-benchmark/issues"

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML",
]

[project.scripts]
rag-benchmark = "rag_benchmark.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_benchmark = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
