[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rag-benchmark = "rag_benchmark.cli.main:app"

[project]
name = "erp-ai-assistant"
version = "0.1.3"
description = "AI ERP Assistant"
readme = "README.md"
requires-python = ">=3.12"
langchain-ollama = "^0.3.3"
ollama = "^0.4.7"
authors = [{ name = "vitaliy.parygin" }, { email = "vitaliy.parygin@gmail.com"}]


dependencies = [
    "fastapi",
    "uvicorn",
    "celery[redis]>=5.4.0",
    "redis",
    "qdrant-client==1.18.0",
    "prometheus-client",
    "flower",
    "sqlalchemy",
    "sse_starlette",
    "langchain_core",
    "langgraph",
    "pydantic_settings",
    "structlog",
    "asyncpg",
    "ollama",
    "langchain-ollama",
    "pdfplumber",
    "langchain_text_splitters",
    "qdrant_client",
    "greenlet",
    "rules @ git+https://git@github.com/vitaliyparygin/rules.git@v0.1.10",
    "rag-benchmark @ git+https://git@github.com/vitaliyparygin/rag-benchmark@v0.1.5",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "black",
    "ruff == 0.15.20",
    "mypy == 2.1.0",
    "python-multipart ",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "qdrant-client",
    "openai",
    "langchain",
    "langchain-openai",
    "langgraph",
    "pypdf",
    "pdfplumber",
    "celery",
    "structlog",
    "tenacity",
    "prometheus-client",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "tiktoken",
    "pytest",
    "pytest-asyncio",
    "greenlet"

]

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.mypy]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "langfuse",
    "langfuse.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
omit = [
    "*/tests/*",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.uv.sources]
rag-benchmark = { git = "https://github.com/vitaliyparygin/rag-benchmark", rev = "v0.1.5" }
rules = { git = "https://github.com/vitaliyparygin/rules", rev = "v0.1.10" }

[tool.hatch.metadata]
allow-direct-references = true
