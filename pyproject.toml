[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rag-benchmark = "rag_benchmark.cli.main:app"

[project]
name = "erp-ai-assistant"
version = "0.1.0"
description = "AI ERP Assistant"
readme = "README.md"
requires-python = ">=3.12"
langchain-ollama = "^0.3.3"
ollama = "^0.4.7"
authors = [{ name = "vitaliy.parygin" }, { email = "vitalit.parygin@gmail.com"}]


dependencies = [
    "fastapi",
    "uvicorn",
    "celery[redis]>=5.4.0",
    "redis",
    "qdrant-client",
    "prometheus-client",
    "flower",
    "sqlalchemy",
    "sse_starlette",
    "langchain_core",
    "langgraph",
    "pydantic_settings",
    "structlog",
    "asyncpg",
    "ollama",
    "langchain-ollama",
    "pdfplumber",
    "langchain_text_splitters",
    "langchain-ollama",
    "ollama",
    "qdrant_client",
    "green",
    "rag-benchmark",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "python-multipart ",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "qdrant-client",
    "openai",
    "langchain",
    "langchain-openai",
    "langgraph",
    "pypdf",
    "pdfplumber",
    "celery",
    "structlog",
    "tenacity",
    "prometheus-client",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "tiktoken"

]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
rag-benchmark = { git = "https://github.com/vitaliyparygin/rag-benchmark.git" }
