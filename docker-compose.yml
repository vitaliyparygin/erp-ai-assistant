
x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-false}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 10s
  retries: 5
  start_period: 30s

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: ${BUILD_TARGET:-development}
    container_name: erp_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic
      - uploads_data:/app/uploads
      - ./scripts:/app/scripts:ro
    environment:
      TZ: Europe/Kyiv
      PGTZ: Europe/Kyiv
      <<: *common-env
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      SECRET_KEY: ${SECRET_KEY}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
#      <<: *healthcheck-defaults
    networks:
      - erp_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.erp-assistant.local`)"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug


  # ---------------------------------------------------------------------------
  # Celery Worker — Background Task Processing
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: development

    container_name: erp_worker

    restart: unless-stopped

    command: python -m celery -A app.workers.celery_app worker --loglevel=info  --pool=solo -Q ingestion

    volumes:
    - ./app:/app/app
    - uploads_data:/app/uploads

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}

    env_file:
    - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started

    networks:
    - erp_network

